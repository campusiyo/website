<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Campusiyo - University Study Notes Portal</title>
  <style>
    body {
      background-color: #0B0D12;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 161, 108, 0.2);
      border-radius: 50%;
      border-top-color: #00A16C;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    if (window.navigator.onLine) {
      window.location.replace("https://campusiyo.in");
    } else {
      window.addEventListener("online", function() {
        window.location.replace("https://campusiyo.in");
      });
    }
  </script>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <span style="font-size: 14px; font-weight: 600; tracking: 0.05em; color: rgba(255,255,255,0.7);">Connecting to Campusiyo...</span>
  </div>
</body>
</html>
